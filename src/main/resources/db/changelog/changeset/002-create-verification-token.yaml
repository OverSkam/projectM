databaseChangeLog:
  - changeSet:
      id: 002-create-verification-tokens
      author: overskam
      changes:
        - createTable:
            tableName: verification_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_verification_tokens_token

              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: create_date
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: last_modified_date
                  type: timestamp

        - addUniqueConstraint:
            tableName: verification_tokens
            columnNames: user_id
            constraintName: uk_verification_tokens_user_id

        - addForeignKeyConstraint:
            baseTableName: verification_tokens
            baseColumnNames: user_id
            constraintName: fk_verification_tokens_user
            referencedTableName: users
            referencedColumnNames: id