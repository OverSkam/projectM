spring:
  mail:
    host: ${RESEND_SMTP_HOST:smtp.resend.com}
    port: ${RESEND_SMTP_PORT:587}
    username: ${RESEND_SMTP_USERNAME:resend}
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${APP_MAIL_FROM:ProjectM <noreply@your-domain.com>}
    verification-url: ${APP_VERIFICATION_URL:https://api.your-domain.com/api/v1/auth/verify}