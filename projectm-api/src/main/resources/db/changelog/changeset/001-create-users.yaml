databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: overskam
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: varchar(320)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: token_version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: create_date
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: last_modified_date
                  type: timestamp