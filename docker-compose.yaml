services:
  postgres:
    image: postgres:17-alpine
    container_name: projectm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: projectm-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: projectm
      MONGO_INITDB_ROOT_PASSWORD: projectm
      MONGO_INITDB_DATABASE: projectm
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: projectm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: projectm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: projectm
      RABBITMQ_DEFAULT_PASS: projectm
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: projectm-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: projectm
      MINIO_ROOT_PASSWORD: projectm123
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on: [ minio ]
    entrypoint: >
      /bin/sh -c "
      until mc alias set pm http://minio:9000 projectm projectm123; do sleep 1; done;
      mc mb --ignore-existing pm/projectm-artifacts;
      "

  api:
    build: ./projectm-api
    container_name: projectm-api
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public
      MONGODB_URI: mongodb://projectm:projectm@mongo:27017/projectm?authSource=admin
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: ./projectm-build-worker
    container_name: projectm-worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public
      MONGODB_URI: mongodb://projectm:projectm@mongo:27017/projectm?authSource=admin
      RABBITMQ_HOST: rabbitmq
      S3_ENDPOINT: http://minio:9000

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data: